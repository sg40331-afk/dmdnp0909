<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="pitchTitle"><title id="pitchTitle">픽셀 피치는 이웃한 픽셀 중심 사이의 거리이며 P5는 5mm, P10은 10mm를 뜻합니다</title><rect width="1000" height="360" rx="18" fill="#f6f8fc"/><g font-family="Malgun Gothic,sans-serif" fill="#12243a"><text x="40" y="48" font-size="25" font-weight="700">픽셀 간격을 뜻하는 P, 화면 크기와 함께 확인하세요</text><text x="40" y="80" font-size="17">구조 이해용 개념도 · 취급 제품이나 실제 모듈 규격을 확정하는 도면이 아닙니다.</text><text x="40" y="131" font-size="22" font-weight="700">픽셀 중심 ↔ 픽셀 중심 = 피치</text><text x="520" y="131" font-size="22" font-weight="700">동일 화면의 수학적 비교 예시</text><text x="520" y="172" font-size="19">발광 화면 1,920 × 480mm를 가정하면</text><text x="520" y="218" font-size="25">P5  →  384 × 96 픽셀</text><text x="520" y="264" font-size="25">P10 →  192 × 48 픽셀</text><text x="520" y="308" font-size="16">실제 규격·해상도는 공급 모듈 조합에 따라 확정합니다.</text></g><rect x="40" y="155" width="410" height="160" rx="10" fill="#111c28"/><g fill="#2d7ff9"><circle cx="100" cy="205" r="13"/><circle cx="205" cy="205" r="13"/><circle cx="310" cy="205" r="13"/><circle cx="415" cy="205" r="13"/><circle cx="100" cy="275" r="13"/><circle cx="205" cy="275" r="13"/><circle cx="310" cy="275" r="13"/><circle cx="415" cy="275" r="13"/></g><path d="M100 240H205M100 232V248M205 232V248" stroke="#fff" stroke-width="3"/><text x="139" y="233" fill="#fff" font-family="sans-serif" font-size="19">P</text></svg>